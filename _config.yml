# Site
title: Horizon & Jasmine
subtitle: 码上见性，屏前忘机
description: Horizon & Jasmine 个人技术博客
author: Horizon
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://holycandle.github.io
root: /
permalink: :year/:month/:day/:title/

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 1
render_drafts: false
post_asset_folder: false
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
date_format: MM-DD
time_format: HH:mm:ss

# Pagination
per_page: 10
pagination_dir: page

# Theme
theme: jasmine

# Extensions
# Giscus 评论
giscus:
  enable: true
  repo: holycandle/holycandle.github.io
  repo_id: 'R_kgDOTGE5Gg'
  category: 'Announcements'
  category_id: 'DIC_kwDOTGE5Gs4C_8dE'
  mapping: 'pathname'
  strict: '0'
  reactions_enabled: '1'
  emit_metadata: '0'
  input_position: 'bottom'
  theme: 'preferred_color_scheme'
  lang: 'zh-CN'

# Deployment (GitHub Actions handles this)
deploy:
  type: ''
